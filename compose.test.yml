services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U integration -d integration']
      interval: 1s
      timeout: 2s
      retries: 30
