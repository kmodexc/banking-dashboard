name: Test

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check:types
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:components

  rust-store-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: integration
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo check --locked
      - run: cargo build --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --test store_integration --test api_integration -- --test-threads=1
        env:
          DATABASE_URL: postgres://integration:integration@127.0.0.1:5432/integration
      - run: cargo test --locked --lib
      - run: cargo clippy --locked --all-targets -- -D warnings

  production-browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production

  container-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:deployment
